<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Event System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #dfe6e9;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: #6c5ce7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #5a4ad1;
        }
        .error {
            color: #e74c3c;
            margin-top: 1rem;
        }
        .signup-link, .dashboard-link {
            margin-top: 1rem;
        }
        .signup-link a, .dashboard-link a {
            color: #6c5ce7;
            text-decoration: none;
        }
        .signup-link a:hover, .dashboard-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="login.php" method="post" id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit">Login</button>
            <div id="message" class="error"></div>
            <div class="signup-link">
                <p>Not registered? <a href="signup.html">Sign up</a></p>
            </div>
            <div class="dashboard-link" id="dashboard-link" style="display: none;">
                <p>Already logged in? <a href="dashboard.html">Go to Dashboard</a></p>
            </div>
        </form>
    </div>
    <script>
        fetch('check_session.php')
            .then(response => response.json())
            .then(data => {
                if (data.loggedIn) {
                    document.getElementById('dashboard-link').style.display = 'block';
                    document.getElementById('dashboard-link').querySelector('a').href = data.isAdmin ? 'admin.html' : 'dashboard.html';
                }
            })
            .catch(() => {
                document.getElementById('message').textContent = 'Error checking session.';
            });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const response = await fetch('login.php', {
                    method: 'POST',
                    body: formData
                });
                if (response.redirected) {
                    window.location.href = response.url;
                } else {
                    const text = await response.text();
                    document.getElementById('message').textContent = text;
                }
            } catch (err) {
                document.getElementById('message').textContent = 'An error occurred. Please try again.';
            }
        });
    </script>
</body>
</html>
