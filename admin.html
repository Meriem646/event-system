<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script>
        // Check admin status
        async function checkAdmin() {
            try {
                const response = await fetch('session_check.php');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                if (!data.loggedIn || !data.isAdmin) {
                    throw new Error('Admin access required');
                }
            } catch (e) {
                console.error('Error checking admin status:', e.message);
                alert('Access denied: ' + e.message);
                window.location.href = 'login.html';
            }
        }
        checkAdmin();

        // Load locations for dropdowns
        async function loadLocations() {
            try {
                const response = await fetch('get_locations.php');
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! Status: ${response.status}, Response: ${errorText}`);
                }
                const locations = await response.json();
                if (!Array.isArray(locations)) {
                    throw new Error('Invalid response: Expected JSON array, got: ' + JSON.stringify(locations));
                }
                const addLocationSelect = document.getElementById('event_location');
                const editLocationSelect = document.getElementById('edit_event_location');
                addLocationSelect.innerHTML = '<option value="">Select Location</option>' + 
                    locations.map(loc => `<option value="${loc.LocationName}">${loc.LocationName}</option>`).join('');
                editLocationSelect.innerHTML = '<option value="">Select Location</option>' + 
                    locations.map(loc => `<option value="${loc.LocationName}">${loc.LocationName}</option>`).join('');
            } catch (e) {
                console.error('Error loading locations:', e.message);
                document.getElementById('event-message').className = 'error';
                document.getElementById('event-message').textContent = 'Failed to load locations: ' + e.message;
            }
        }

        // Load events
        async function loadEvents() {
            try {
                const response = await fetch('events.php');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const events = await response.json();
                const eventsTable = document.getElementById('events-table');
                eventsTable.innerHTML = events.map(event => `
                    <tr>
                        <td>${event.EventID}</td>
                        <td>${event.EventName}</td>
                        <td>${event.Date}</td>
                        <td>${event.Location ?? ''}</td>
                        <td>${event.Description ?? ''}</td>
                        <td>
                            <button class="action-button" onclick="populateEditForm(${event.EventID}, '${(event.EventName || '').replace(/'/g, "\\'")}', '${event.Date}', '${(event.Location || '').replace(/'/g, "\\'")}', '${(event.Description || '').replace(/'/g, "\\'")}')">Edit</button>
                            <button class="action-button" onclick="deleteEvent(${event.EventID})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Error loading events:', e.message);
                document.getElementById('event-message').className = 'error';
                document.getElementById('event-message').textContent = 'Failed to load events: ' + e.message;
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const response = await fetch('manage_users.php');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const users = await response.json();
                const usersTable = document.getElementById('users-table');
                usersTable.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.UserID}</td>
                        <td>${user.Username}</td>
                        <td>${user.Email ?? ''}</td>
                        <td>${user.Phone ?? ''}</td>
                        <td>
                            <button class="action-button" onclick="deleteUser(${user.UserID})">Delete</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Error loading users:', e.message);
                document.getElementById('event-message').className = 'error';
                document.getElementById('event-message').textContent = 'Failed to load users: ' + e.message;
            }
        }

        // Load registrations
        async function loadRegistrations() {
            try {
                const response = await fetch('view_registrations.php');
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                const registrations = await response.json();
                const registrationsTable = document.getElementById('registrations-table');
                registrationsTable.innerHTML = registrations.map(reg => `
                    <tr>
                        <td>${reg.RegistrationID}</td>
                        <td>${reg.Username}</td>
                        <td>${reg.Email ?? ''}</td>
                        <td>${reg.EventName}</td>
                        <td>${reg.Date}</td>
                        <td>${reg.Location ?? ''}</td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('Error loading registrations:', e.message);
                document.getElementById('event-message').className = 'error';
                document.getElementById('event-message').textContent = 'Failed to load registrations: ' + e.message;
            }
        }

        // Import events from Excel
        async function importEvents() {
            const fileInput = document.getElementById('event-file');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a file.');
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(e) {
                gk_fileData['events.xlsx'] = e.target.result.split(',')[1];
                gk_isXlsx = true;
                gk_xlsxFileLookup['events.xlsx'] = true;
                const csv = loadFileData('events.xlsx');
                try {
                    const response = await fetch('import_events.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ csv })
                    });
                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                    const text = await response.text();
                    document.getElementById('event-message').className = text.includes('successfully') ? 'success' : 'error';
                    document.getElementById('event-message').textContent = text;
                    loadEvents();
                } catch (e) {
                    console.error('Error importing events:', e.message);
                    document.getElementById('event-message').className = 'error';
                    document.getElementById('event-message').textContent = 'Failed to import events: ' + e.message;
                }
            };
            reader.readAsDataURL(file);
        }

        // Populate edit form
        function populateEditForm(id, name, date, location, description) {
            document.getElementById('edit_event_id').value = id;
            document.getElementById('edit_event_name').value = name;
            document.getElementById('edit_event_date').value = date;
            document.getElementById('edit_event_location').value = location;
            document.getElementById('edit_event_description').value = description;
        }

        // Delete event
        async function deleteEvent(id) {
            if (confirm('Are you sure you want to delete this event?')) {
                try {
                    const response = await fetch(`delete_event.php?event_id=${id}`);
                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                    const text = await response.text();
                    document.getElementById('event-message').className = text.includes('successfully') ? 'success' : 'error';
                    document.getElementById('event-message').textContent = text;
                    loadEvents();
                } catch (e) {
                    console.error('Error deleting event:', e.message);
                    document.getElementById('event-message').className = 'error';
                    document.getElementById('event-message').textContent = 'Failed to delete event: ' + e.message;
                }
            }
        }

        // Delete user
        async function deleteUser(id) {
            if (confirm('Are you sure you want to delete this user?')) {
                try {
                    const response = await fetch(`delete_user.php?user_id=${id}`);
                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                    const text = await response.text();
                    document.getElementById('event-message').className = text.includes('successfully') ? 'success' : 'error';
                    document.getElementById('event-message').textContent = text;
                    loadUsers();
                } catch (e) {
                    console.error('Error deleting user:', e.message);
                    document.getElementById('event-message').className = 'error';
                    document.getElementById('event-message').textContent = 'Failed to delete user: ' + e.message;
                }
            }
        }

        // Handle form submissions
        async function handleFormSubmission(formId, messageId, successCallback) {
            const form = document.getElementById(formId);
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(form);
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData
                    });
                    if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                    const text = await response.text();
                    const messageDiv = document.getElementById(messageId);
                    messageDiv.className = text.includes('successfully') ? 'success' : 'error';
                    messageDiv.textContent = text;
                    form.reset();
                    if (successCallback) successCallback();
                } catch (e) {
                    console.error(`Error submitting ${formId}:`, e.message);
                    document.getElementById(messageId).className = 'error';
                    document.getElementById(messageId).textContent = 'An error occurred: ' + e.message;
                }
            });
        }

        // Initialize
        handleFormSubmission('add-event-form', 'event-message', loadEvents);
        handleFormSubmission('edit-event-form', 'event-message', loadEvents);
        handleFormSubmission('add-category-form', 'category-message');
        handleFormSubmission('add-location-form', 'location-message', loadLocations);
        loadLocations();
        loadEvents();
        loadUsers();
        loadRegistrations();
    </script>
